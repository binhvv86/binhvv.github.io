{k:'KPI 8',n:'LPPC_Meat',w:2.7511,ctv:3.8,th:'AO',p:'AP',f:'x',fix:1}];
const nf=new Intl.NumberFormat('vi-VN');
const M=v=>v>=1e9?(v/1e9).toFixed(2)+' tỷ':v>=1e6?(v/1e6).toFixed(1)+' tr':nf.format(Math.round(v));
const fv=(v,f)=>f=='m'?M(v):f=='x'?v.toFixed(2):nf.format(Math.round(v));
const P=v=>(v*100).toFixed(1)+'%';
const st=(p,fix)=>{const t=fix?1:prog;return p>=t?'ok':p>=.8*t?'warn':'bad'};
const ct=(o,k)=>k.ctv??o[k.ct];
document.getElementById('mo').textContent=D.month;
document.getElementById('as').textContent='Số liệu đến '+D.asof.split('-').reverse().join('/')+' · Ngày '+D.day+'/'+D.days;
document.getElementById('pt').textContent='Tiến độ thời gian: '+P(prog);
document.getElementById('pb').style.width=P(prog);
document.getElementById('kp').innerHTML=K.map(k=>{const p=T[k.p],s=st(p,k.fix);
return `<div class="k"><div class="t"><span>${k.k}</span><span>Tỷ trọng ${k.w}%</span></div><div class="n">${k.n}</div>
<div class="p ${s}">${P(p)}</div><div class="tr"><i class="bg-${s}" style="width:${Math.min(p,1)*100}%"></i>${k.fix?'':`<u style="left:${prog*100}%"></u>`}</div>
<div class="d">${fv(T[k.th],k.f)} / ${fv(ct(T,k),k.f)}${k.bq?' · cần '+fv(T[k.bq],k.f)+'/ngày':''}</div></div>`}).join('');
const bon=['AV','AZ','BG','BK','BN','BR'];
R.forEach(r=>r.bonus=bon.reduce((a,c)=>a+(r[c]||0),0));T.bonus=bon.reduce((a,c)=>a+(T[c]||0),0);
let sk='name',sd=1,sel=0;
const cols=[{h:'Nhân viên',g:r=>r.name}].concat(K.map(k=>({h:k.k+' · '+k.n.split(' (')[0],g:r=>r[k.p],k})),[{h:'Thưởng',g:r=>r.bonus}]);
function draw(){
 const rows=R.map((r,i)=>[r,i]).sort((a,b)=>{const x=cols[sk].g(a[0]),y=cols[sk].g(b[0]);return (x>y?1:x<y?-1:0)*sd});
 document.getElementById('th').innerHTML='<tr>'+cols.map((c,i)=>`<th data-i="${i}">${c.h}${i==sk?(sd>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
 document.getElementById('tb').innerHTML=rows.map(([r,i])=>`<tr data-r="${i}" class="${i==sel?'sel':''}">`+cols.map((c,j)=>j==0?`<td>${r.name}</td>`:c.k?`<td><span class="c ${st(r[c.k.p],c.k.fix)}">${P(r[c.k.p])}</span></td>`:`<td>${r.bonus?M(r.bonus):'–'}</td>`).join('')+'</tr>').join('');
 document.getElementById('tf').innerHTML='<tr><td>Tổng</td>'+K.map(k=>`<td><span class="c ${st(T[k.p],k.fix)}">${P(T[k.p])}</span></td>`).join('')+`<td>${M(T.bonus)}</td></tr>`;
 document.querySelectorAll('#th th').forEach(h=>h.onclick=()=>{const i=+h.dataset.i;sd=sk==i?-sd:(i?-1:1);sk=i;draw()});
 document.querySelectorAll('#tb tr').forEach(t=>t.onclick=()=>{sel=+t.dataset.r;draw();det()});
}
function det(){const r=R[sel];document.getElementById('dn').textContent='· '+r.name;
 const bl=[['Gia vị – Xốt Chinsu',`${r.AU}/${r.AT||5} CH · TBay ${r.AS}`,r.AV],['Mì (CVF)',M(r.AX)+' / '+M(r.AW)+' · '+P(r.AY),r.AZ],['Nghành Meat',M(r.BB)+' / '+M(r.BA)+' · '+P(r.BF),r.BG],['TBTN Tea 365',r.BI+' CH · '+P(r.BJ),r.BK],['Ruby & STT',r.BL+' Ruby · '+r.BM+' STT',r.BN],['ASO Homey',r.BP+' / 15 · '+P(r.BQ),r.BR]];
 document.getElementById('dt').innerHTML=K.map(k=>`<div class="x"><b>${k.k} · ${k.n}</b><span><i>Chỉ tiêu</i><i>${fv(ct(r,k),k.f)}</i></span><span><i>Thực hiện</i><i>${fv(r[k.th],k.f)}</i></span><span><i>% đạt</i><i class="${st(r[k.p],k.fix)}">${P(r[k.p])}</i></span>${k.bq?`<span><i>Cần/ngày</i><i>${fv(r[k.bq],k.f)}</i></span>`:`<span><i>Mức đạt</i><i>${r.Q&&k.n=='LPPC'?r.Q:r.AQ}</i></span>`}</div>`).join('')
 +`<div class="x"><b>Doanh số hôm qua</b><span><i>Số tiền</i><i>${M(r.B)}</i></span><span><i>% chỉ tiêu</i><i>${P(r.C)}</i></span></div>`
 +`<div class="x"><b>Kênh ON / MCP</b><span><i>MCP ON</i><i>${r.BS}</i></span><span><i>MCP Bev</i><i>${r.BT}</i></span><span><i>ASO Tea</i><i>${r.BU}</i></span><span><i>ASO</i><i>${r.BV}</i></span></div>`
 +`<div class="x"><b>WinX · Combo</b><span><i>WinX</i><i>${M(r.CB)} / ${M(r.CA)} (${P(r.CG)})</i></span><span><i>Combo</i><i>${M(r.CD)} / ${M(r.CC)} (${P(r.CH)})</i></span></div>`
 +bl.map(b=>`<div class="x"><b>Thưởng ${b[0]}</b><span><i>${b[1]}</i></span><span><i>Thưởng</i><i>${b[2]?M(b[2]):'–'}</i></span></div>`).join('')}
const s1=[...R].sort((a,b)=>b.F-a.F),mx=Math.max(...R.map(r=>r.F),prog,.01)*1.1;
document.getElementById('c1').innerHTML=s1.map(r=>`<div class="row"><span class="nm">${r.name}</span><div class="tr"><i class="bg-${st(r.F)}" style="width:${r.F/mx*100}%"></i><u style="left:${prog/mx*100}%"></u></div><b>${P(r.F)}</b></div>`).join('')+`<div class="leg">Vạch đen = tiến độ thời gian (${P(prog)}).</div>`;
const s2=[...R].sort((a,b)=>b.bonus-a.bonus),mb=Math.max(...R.map(r=>r.bonus),1);
document.getElementById('c2').innerHTML=s2.map(r=>`<div class="row"><span class="nm">${r.name}</span><div class="tr"><i class="bg-ok" style="width:${r.bonus/mb*100}%"></i></div><b>${r.bonus?M(r.bonus):'–'}</b></div>`).join('')+`<div class="leg">Gồm thưởng Chinsu, Mì, Meat, Tea 365, Ruby/STT, Homey theo sheet.</div>`;
draw();det();
</script></body></html>
