 L.map(c=>`<tr><td>${c[1]}</td><td>${c[2]||''}</td><td>${dstr(c[3])}</td><td><span class="c ${c[5][j]=='1'?'ok':'bad'}">${c[5][j]=='1'?'Thỏa':'Chưa'}</span></td><td>${v(c)}</td></tr>`).join('')+(L.length?'':'<tr><td colspan="5">Không có khách hàng phù hợp bộ lọc</td></tr>')+'</tbody></table></div></div>'}
function tbList(i,pr){const T=D.tb,ok=x=>x[6]>=1,L0=T.det.filter(x=>x[0]==i&&(pr<0||x[1]==pr)&&dayOk(x[4])),a=L0.filter(ok).length;
 let L=S.res===''?L0:L0.filter(x=>(ok(x)?'1':'0')==S.res);L=[...L].sort((x,y)=>((x[4]||'9')>(y[4]||'9')?1:(x[4]||'9')<(y[4]||'9')?-1:0)||(x[2]>y[2]?1:-1));
 return `<div class="lp"><h3><span>Chi tiết trưng bày · ${pr<0?'Tất cả chương trình':T.p[pr].n} · ${D.nv[i]} — Đạt <b class="ok">${a}</b> · Chưa <b class="bad">${L0.length-a}</b></span><button class="d" data-x="1" style="margin:0">Đóng</button></h3><div class="sc2"><table><thead><tr><th>Mã KH</th><th>Tên cửa hàng</th><th>Thứ</th><th>Bộ ảnh</th><th>Kết quả</th></tr></thead><tbody>`+L.map(x=>`<tr><td>${x[2]}</td><td>${x[3]}${pr<0?'<br><small style="color:var(--mut)">'+T.p[x[1]].n+'</small>':''}</td><td>${dstr(x[4])}</td><td>${x[6]}</td><td><span class="c ${ok(x)?'ok':'bad'}">${ok(x)?'Đạt':'Chưa'}</span></td></tr>`).join('')+(L.length?'':'<tr><td colspan="5">Không có dữ liệu phù hợp</td></tr>')+'</tbody></table></div></div>'}
/* ---------- tab 1 ---------- */
function tab0(){const ix=idx(),sel=S.nv===''?D.tot:D.rows[S.nv],c=cur(),r=D.rows[c];
 let o='<div class="grid">'+K.map((k,j)=>{const p=sel[k[5]],s=st(p,j);return `<div class="k"><div class="t"><span>${k[0]}</span><span>${k[2]}%</span></div><div class="p ${s}">${P(p)}</div><div class="tr"><i class="bg-${s}" style="width:${Math.min(p,1)*100}%"></i>${fx(j)?'':`<u style="left:${prog*100}%"></u>`}</div><div class="d">${fv(sel[k[4]],k[7])} / ${fv(ctv(sel,k),k[7])}</div></div>`}).join('')+'</div>';
 const cols=[{h:'Nhân viên',g:x=>x.name}];K.forEach((k,j)=>cols.push({h:'Chỉ tiêu',g:x=>ctv(x,k),j,t:'c'},{h:'Thực hiện',g:x=>x[k[4]],j,t:'t'},{h:'%',g:x=>x[k[5]],j,t:'p'}));cols.push({h:'Thưởng',g:x=>D.b.rows[D.rows.indexOf(x)].tt});
 const cell=(x,q)=>{if(!q.j&&q.j!==0)return q.h=='Thưởng'?`<td>${q.g(x)?M(q.g(x)):'–'}</td>`:`<td>${x.name}</td>`;const k=K[q.j];return q.t=='p'?`<td>${chip(x[k[5]],q.j)}</td>`:`<td>${fv(q.t=='c'?ctv(x,k):x[k[4]],k[7])}</td>`};
 const L=cols.length-1,ar=i=>i==S.sk?(S.sd>0?' ▲':' ▼'):'';
 const rows=ix.map(i=>D.rows[i]).sort((a,b)=>{const x=cols[S.sk].g(a),y=cols[S.sk].g(b);return(x>y?1:x<y?-1:0)*S.sd});
 o+=`<h2>KẾT QUẢ THEO NHÂN VIÊN <span class="sub">· bấm tiêu đề để sắp xếp, bấm dòng để xem chi tiết</span></h2><div class="sc"><table style="min-width:1500px"><thead><tr><th rowspan="2" data-i="0">Nhân viên${ar(0)}</th>`+K.map(k=>`<th colspan="3" class="gh">${k[0]}</th>`).join('')+`<th rowspan="2" data-i="${L}">Thưởng${ar(L)}</th></tr><tr>`+cols.slice(1,L).map((q,i)=>`<th data-i="${i+1}">${q.h}${ar(i+1)}</th>`).join('')+'</tr></thead><tbody>'+
 rows.map(x=>`<tr data-r="${D.rows.indexOf(x)}" class="${D.rows.indexOf(x)==c?'sel':''}">`+cols.map(q=>cell(x,q)).join('')+'</tr>').join('')+'</tbody>'+(S.nv===''?'<tfoot><tr><td>Tổng</td>'+cols.slice(1,L).map(q=>cell(D.tot,q)).join('')+`<td>${M(D.b.tt)}</td></tr></tfoot>`:'')+'</table></div>';
 o+=`<h2>BẢNG CHI TIẾT THEO NHÂN VIÊN · ${r.name}</h2><div class="det">`+K.map((k,j)=>{let x=`<div class="x"><b>${k[1]}</b><span><i>Chỉ tiêu</i><i>${fv(ctv(r,k),k[7])}</i></span><span><i>Thực hiện</i><i>${fv(r[k[4]],k[7])}</i></span><span><i>% đạt</i><i class="${st(r[k[5]],j)}">${P(r[k[5]])}</i></span>`+(k[7]=='x'?`<span><i>Mức đạt</i><i>${r[k[6]]||'–'}</i></span>`:`<span><i>BQ/ngày</i><i>${fv(r[k[6]],k[7])}</i></span>`);
  if(j==4){const V=r.V,c1=Math.min(V,r.W),c2=Math.min(V-c1,r.X),c3=Math.max(0,V-c1-c2),p2=!(r.W>r.Y),p3=p2&&r.X<=r.Z;x+=`<div class="sb">CT: ƯT1 ${c1} · ƯT2 ${c2} · ƯT3 ${c3}<br>TH: ƯT1 ${r.Y} · ƯT2 ${p2?r.Z:0} · ƯT3 ${p3?r.AA:0}</div>`}
  return x+`<button class="d" data-k="${j}">Chi tiết khách hàng</button></div>`}).join('')
 +`<div class="x"><b>Doanh số hôm qua</b><span><i>Số tiền</i><i>${M(r.B)}</i></span><span><i>% chỉ tiêu</i><i>${P(r.C)}</i></span></div><div class="x"><b>Kênh ON / MCP</b><span><i>MCP ON</i><i>${r.BS}</i></span><span><i>MCP Bev</i><i>${r.BT}</i></span><span><i>ASO Tea</i><i>${r.BU}</i></span><span><i>ASO</i><i>${r.BV}</i></span></div><div class="x"><b>WinX · Combo</b><span><i>WinX</i><i>${M(r.CB)} / ${M(r.CA)} (${P(r.CG)})</i></span><span><i>Combo</i><i>${M(r.CD)} / ${M(r.CC)} (${P(r.CH)})</i></span></div></div>`;
 return o+(S.d&&S.d.k!==undefined?custList(c,S.d.k):'')}
/* ---------- tab 2 ---------- */
function tab1(){const B=D.b,ix=idx(),c=cur(),sum=S.nv===''?B.tt:B.rows[S.nv].tt;
 const hd='<tr><th rowspan="2">Nhân viên</th>'+B.g.map((g,i)=>`<th colspan="${B.rows[0].g[i].length}" class="gh">${g.t.replace(/^Thưởng /,'')}</th>`).join('')+'<th rowspan="2">Tổng thưởng</th></tr><tr>'+B.rows[0].g.map(g=>g.map(x=>`<th>${x[0]}</th>`).join('')).join('')+'</tr>';
 const rw=(n,g,t,cl)=>`<tr ${cl}><td>${n}</td>`+g.map(a=>a.map(x=>`<td>${x[1]===''?'–':x[1]}</td>`).join('')).join('')+`<td><b>${t?nf.format(t):'–'}</b></td></tr>`;
 let o=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))"><div class="k"><div class="t"><span>${S.nv===''?'Tổng thưởng tạm tính':B.rows[S.nv].name}</span></div><div class="p ok">${nf.format(sum)} đ</div></div></div>`;
 o+='<h2>THƯỞNG NGÀNH HÀNG THEO NHÂN VIÊN <span class="sub">· bấm dòng để xem điều kiện thưởng</span></h2><div class="sc"><table style="min-width:1700px"><thead>'+hd+'</thead><tbody>'+ix.map(i=>rw(D.nv[i],B.rows[i].g,B.rows[i].tt,`data-r="${i}" class="${i==c?'sel':''}"`)).join('')+'</tbody>'+(S.nv===''?'<tfoot>'+rw('Tổng',B.tot,B.tt,'')+'</tfoot>':'')+'</table></div>';
 const r=B.rows[c];o+=`<h2>CHI TIẾT THƯỞNG · ${r.name}</h2><div class="det">`+r.g.map((g,i)=>`<div class="x"><b>${B.g[i].t}</b>${g.map(x=>`<span><i>${x[0]}</i><i>${x[1]===''?'–':x[1]}</i></span>`).join('')}${B.g[i].d?`<div class="ds">${B.g[i].d}</div>`:''}</div>`).join('')+'</div>';return o}
/* ---------- tab 3 ---------- */
function tab2(){const T=D.tb,ix=idx(),c=cur(),L=T.lab;
 const hd='<tr><th rowspan="2">Nhân viên</th>'+T.p.map(p=>`<th colspan="2" class="gh">${p.n.replace('Đại sứ - Ngành ','ĐS ')}</th>`).join('')+`<th colspan="${L.length}" class="gh">Tổng</th></tr><tr>`+T.p.map(()=>'<th>ĐK</th><th>Đạt</th>').join('')+L.map(x=>`<th>${x}</th>`).join('')+'</tr>';
 const rw=(n,v,cl)=>`<tr ${cl}><td>${n}</td>`+v.slice(0,7).map(a=>`<td>${a[0]}</td><td>${a[1]}</td>`).join('')+v[7].map(x=>`<td>${x}</td>`).join('')+'</tr>';
 let o='<div class="note sub" style="margin-top:12px">ĐK = số cửa hàng đăng ký chương trình · Đạt = có ít nhất 1 bộ ảnh được duyệt.</div><h2>TRƯNG BÀY THEO NHÂN VIÊN <span class="sub">· bấm dòng để xem chương trình, bấm Chi tiết để xem khách hàng</span></h2><div class="sc"><table style="min-width:1400px"><thead>'+hd+'</thead><tbody>'+ix.map(i=>rw(D.nv[i],T.rows[i].v,`data-r="${i}" class="${i==c?'sel':''}"`)).join('')+'</tbody>'+(S.nv===''?'<tfoot>'+rw('Tổng',T.tot,'')+'</tfoot>':'')+'</table></div>';
 const r=T.rows[c],x=r.v[7];o+=`<h2>CHI TIẾT TRƯNG BÀY · ${r.name}</h2><div class="det">`+T.p.map((p,j)=>{const a=+r.v[j][0],b=+r.v[j][1];return `<div class="x"><b>${p.n}</b><span><i>Đăng ký (ĐK)</i><i>${a}</i></span><span><i>Đạt</i><i>${b}</i></span><span><i>%</i><i class="${a?(b/a>=.9?'ok':b/a>=.7?'warn':'bad'):''}">${a?(b/a*100).toFixed(0)+'%':'–'}</i></span><button class="d" data-p="${j}">Chi tiết khách hàng</button></div>`}).join('')+`<div class="x"><b>Tổng</b>${L.map((l,q)=>`<span><i>${l}</i><i>${x[q]}</i></span>`).join('')}<button class="d" data-p="-1">Chi tiết tất cả</button></div></div>`;
 return o+(S.d&&S.d.p!==undefined?tbList(c,S.d.p):'')}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.className=+b.dataset.t==S.tab?'on':'');
 $('fr0').style.display=S.tab==1?'none':'';
 $('lg').innerHTML=S.tab==0?'Màu: <span class="ok">xanh</span> = đạt/vượt tiến độ ngày; <span class="warn">vàng</span> = ≥80% tiến độ; <span class="bad">đỏ</span> = chậm. LPPC và LPPC_Meat so với mức cố định (5.5 / 3.8). Bộ lọc Thứ chỉ áp dụng cho danh sách khách hàng ở phần Chi tiết.':'Bộ lọc Thứ chỉ áp dụng cho danh sách khách hàng ở phần Chi tiết.';
 $('out').innerHTML=[tab0,tab1,tab2][S.tab]()}
$('tb').onclick=e=>{const t=e.target.closest('button');if(t){S.tab=+t.dataset.t;S.d=null;render()}};
$('fn').onchange=e=>{S.nv=e.target.value;S.d=null;render()};$('fd').onchange=e=>{S.day=e.target.value;render()};$('fr').onchange=e=>{S.res=e.target.value;render()};
$('out').onclick=e=>{const b=e.target.closest('button.d');
 if(b){if(b.dataset.x)S.d=null;else if(b.dataset.k!==undefined)S.d={k:+b.dataset.k};else S.d={p:+b.dataset.p};render();const l=document.querySelector('.lp');if(l)l.scrollIntoView({block:'nearest'});return}
 const th=e.target.closest('th[data-i]');if(th&&S.tab==0){const i=+th.dataset.i;S.sd=S.sk==i?-S.sd:(i?-1:1);S.sk=i;render();return}

render();
